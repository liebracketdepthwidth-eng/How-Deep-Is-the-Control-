experiment:
  name: "depthwidth_trade_baseline"
  seed: 42
  device: "cuda"

model:
  input_dim: 2
  hidden_dim: 128
  output_dim: 1
  depth: 6
  activation: "relu"

training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 100
  optimizer: "adam"

control:
  arm_length: 1.0
  dt: 0.01
  svd_gap_target: 0.1
